[project]
name = "screenlens"
version = "0.2.0"
description = "ScreenLens — Local video scene intelligence for NVIDIA DGX Spark and Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.19",
    "langchain==1.4.8",
    "langchain-ollama==1.1.0",
    "langchain-community==0.4.2",
    "chromadb==1.5.9",
    "open-clip-torch==3.3.0",
    "opencv-python-headless==5.0.0.93",
    "scikit-image==0.26.0",
    "Pillow==13.0.0",
    "numpy==2.5.4",
    "torch==2.15.0",
    "tqdm==4.70.1",
    "typer==0.27.3",
    "rich==15.0.0",
    "pydantic==2.14.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "pyyaml==6.0.3"]

[project.scripts]
screenlens = "src.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

# The command deck HTML, CSS, JavaScript, and favicon must ship with
# the wheel or `screenlens serve` has nothing to serve.
[tool.setuptools.package-data]
"src.web" = ["static/*"]
